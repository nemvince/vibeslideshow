name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.7.3"

jobs:
  # ---------------------------------------------------------------- linux
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 24.04 ships Qt 6.4; this app needs 6.5, so Qt comes from aqtinstall.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libmpv-dev libgl1-mesa-dev libgl1-mesa-dri libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libegl1 xvfb \
            ffmpeg

      - name: Environment
        run: |
          bash --version | head -1
          cmake --version | head -1
          echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH:-<unset>}"
          echo "Qt: $(command -v qmake6 || command -v qmake || echo none)"
          pkg-config --modversion mpv

      - name: Optional Qt modules
        run: pacman -S --needed --noconfirm mingw-w64-x86_64-qt6-quickcontrols2 || true

      - name: Build
        run: bash scripts/build.sh --release

      - name: Smoke test
        run: |
          set -e
          ./build/vibeslideshow --version          # must work with no display at all
          # The window with two mpv surfaces needs a real GL context, so give it a
          # display: Xvfb plus Mesa's software renderer.
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build/vibeslideshow > /tmp/app.log 2>&1 &
          pid=$!
          sleep 10
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"; wait "$pid" 2>/dev/null
            echo "app stayed up for 10s: ok"
          else
            wait "$pid"; code=$?
            echo "app exited early (code $code)"; tail -30 /tmp/app.log; exit 1
          fi

      - name: Package
        run: bash scripts/package.sh --linux --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------- macos
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew untap aws/tap || true
          brew install qt mpv ffmpeg dylibbundler cmake ninja

      - name: Build
        run: |
          export CMAKE_PREFIX_PATH="$(brew --prefix qt)"
          bash scripts/build.sh --release

      - name: Smoke test
        run: |
          set -e
          BIN="$(find build -type f -name vibeslideshow -perm -u+x | head -1)"
          [ -n "$BIN" ] || { echo "no vibeslideshow binary in build/"; exit 1; }
          echo "binary: $BIN"
          "$BIN" --version
          "$BIN" > /tmp/app.log 2>&1 &
          pid=$!
          sleep 10
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"; echo "app stayed up for 10s: ok"
          else
            wait "$pid"; code=$?
            echo "app exited early (code $code)"; tail -30 /tmp/app.log; exit 1
          fi

      - name: Package
        run: |
          export PATH="$(brew --prefix qt)/bin:$PATH"
          bash scripts/package.sh --macos --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  # -------------------------------------------------------------- windows
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-mpv
            mingw-w64-x86_64-ffmpeg
            zip
            7zip

      - name: Build
        run: bash scripts/build.sh --release

      - name: Smoke test
        run: |
          set -e
          ./build/vibeslideshow.exe --version
          ./build/vibeslideshow.exe > /tmp/app.log 2>&1 &
          pid=$!
          sleep 10
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"; echo "app stayed up for 10s: ok"
          else
            wait "$pid"; code=$?
            echo "app exited early (code $code)"; tail -30 /tmp/app.log; exit 1
          fi

      - name: Package
        run: bash scripts/package.sh --windows --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  # --------------------------------------------------------------- release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
