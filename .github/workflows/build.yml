name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.7.3"

jobs:
  # ---------------------------------------------------------------- linux
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Ubuntu 24.04 ships Qt 6.4; this app needs 6.5, so Qt comes from aqtinstall.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libmpv-dev libgl1-mesa-dev libgl1-mesa-dri libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libegl1 xvfb \
            ffmpeg

      - name: Environment
        run: |
          bash --version | head -1
          cmake --version | head -1
          echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH:-<unset>}"
          echo "Qt: $(command -v qmake6 || command -v qmake || echo none)"
          pkg-config --modversion mpv

      - name: Build
        run: bash scripts/build.sh --release 2>&1 | tee build.log

      - name: Smoke test
        run: |
          set -e
          ./build/vibeslideshow --version          # must work with no display at all
          # The window with two mpv surfaces needs a real GL context, so give it a
          # display: Xvfb plus Mesa's software renderer.
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build/vibeslideshow > /tmp/app.log 2>&1 &
          pid=$!
          sleep 10
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"; wait "$pid" 2>/dev/null
            echo "app stayed up for 10s: ok"
          else
            wait "$pid"; code=$?
            echo "app exited early (code $code)"; tail -30 /tmp/app.log; exit 1
          fi

      - name: Package
        run: bash scripts/package.sh --linux --no-build

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: linux-x86_64-logs
          path: |
            build.log
            app.log

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------- macos
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # Qt does NOT come from Homebrew here. The `qt` formula installs the whole
      # kit — WebEngine, WebView, 3D — which took four of the six minutes this job
      # used to need. aqtinstall fetches only what is downloaded anyway, and that
      # download is cached between runs (same action, same cache as Linux).
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      # The bottles mpv and ffmpeg need, kept between runs: the pour still happens,
      # the downloads do not. Keyed on this file, which is where the formula list
      # lives, so a change here starts a fresh cache.
      - name: Cache Homebrew bottles
        uses: actions/cache@v6.1.0
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: brew-${{ runner.os }}-

      - name: Install libmpv, ffmpeg and dylibbundler
        run: |
          # macos-15: homebrew has bottles for mpv from sequoia up. On macos-14 it
          # builds mpv (and a dozen dependencies) from source instead, which is
          # slow and fragile.
          brew install mpv ffmpeg cmake ninja pkgconf
          # Optional: rewrites the ffmpeg binaries' dylib paths. The packaging
          # script only warns when it is missing, so a formula hiccup must not
          # fail the job.
          brew install dylibbundler || true

      - name: Build
        run: |
          # Both prefixes, colon-separated because that is the list separator these
          # environment variables use on macOS: Qt from aqt, libmpv + its mpv.pc
          # from Homebrew. Without the second one, pkg-config and find_path never
          # see libmpv and configure fails.
          export CMAKE_PREFIX_PATH="${QT_ROOT_DIR}:$(brew --prefix)"
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:${QT_ROOT_DIR}/lib/pkgconfig"
          echo "Qt: ${QT_ROOT_DIR}"
          # pkgconf is a build-dependency of the mpv formula, so it is not installed
          # automatically; it is installed explicitly above. Informational only.
          pkgconf --modversion mpv || echo "no mpv.pc; CMake will use its direct lookup"
          bash scripts/build.sh --release 2>&1 | tee build.log

      - name: Smoke test
        run: |
          set -e
          BIN=""
          for cand in build/vibeslideshow.app/Contents/MacOS/vibeslideshow build/vibeslideshow; do
            if [ -x "$cand" ]; then BIN="$cand"; break; fi
          done
          [ -n "$BIN" ] || { echo "no vibeslideshow binary in build/"; ls -R build | head -40; exit 1; }
          echo "binary: $BIN"
          "$BIN" --version
          "$BIN" > /tmp/app.log 2>&1 &
          pid=$!
          sleep 10
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"; echo "app stayed up for 10s: ok"
          else
            wait "$pid"; code=$?
            echo "app exited early (code $code)"; tail -30 /tmp/app.log; exit 1
          fi

      - name: Package
        run: bash scripts/package.sh --macos --no-build

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: macos-arm64-logs
          path: |
            build.log
            app.log

      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  # -------------------------------------------------------------- windows
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          # UCRT64, not the legacy MINGW64: MSYS2 no longer builds mpv (the only
          # source of libmpv on Windows) for mingw64.
          msystem: UCRT64
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ffmpeg
            zip

      - name: Install Qt 6
        run: |
          pacman -S --needed --noconfirm \
            mingw-w64-ucrt-x86_64-qt6-base \
            mingw-w64-ucrt-x86_64-qt6-declarative \
          || {
            echo "falling back to the qt6 metapackage"
            pacman -S --needed --noconfirm mingw-w64-ucrt-x86_64-qt6
          }

      - name: Environment
        run: |
          bash --version | head -1
          cmake --version | head -1
          echo "MINGW_PREFIX=$MINGW_PREFIX"
          pkgconf --modversion mpv || echo "no mpv.pc"
          command -v windeployqt || echo "no windeployqt"

      - name: Build
        run: bash scripts/build.sh --release 2>&1 | tee build.log

      - name: Smoke test
        run: |
          set -e
          ./build/vibeslideshow.exe --version
          # timeout(1) from coreutils: exit 124 means it was still running after
          # 8 s, which is exactly what a healthy start-up looks like.
          set +e
          timeout 8 ./build/vibeslideshow.exe > app.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then echo "app stayed up: ok"; else
            echo "app exited (code $code)"; tail -30 app.log; exit 1
          fi

      - name: Package
        run: bash scripts/package.sh --windows --no-build

      # The build-tree smoke test above resolves Qt from MSYS2's PATH and cannot
      # notice a bundle that is missing a DLL, so run the deployed copy as well.
      # Its content is asserted by package-windows.sh; this proves it executes.
      # `--version` returns before Qt is constructed, so it cannot notice a bundle
      # whose DLLs shadow Windows' own: that is how 1.0.1 shipped a DWrite.dll that
      # killed the app before its first frame while this step passed. Start the
      # GUI from inside the bundle instead, with nothing but the bundle on PATH.
      - name: Smoke test the bundle
        run: |
          set -e
          bundle="$(echo dist/vibeslideshow-*-windows-x86_64)"
          echo "== bundle: $bundle"
          ( cd "$bundle" && QT_QPA_PLATFORM=offscreen ./vibeslideshow.exe --version )
          set +e
          ( cd "$bundle" && PATH="$PWD:$PATH" timeout 8 ./vibeslideshow.exe > /tmp/bundle.log 2>&1 )
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then echo "bundle stayed up for 8s: ok"; else
            echo "bundle exited early (code $code)"; tail -30 /tmp/bundle.log; exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: windows-x86_64-logs
          path: |
            build.log
            app.log

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  # --------------------------------------------------------------- release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
